services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:1.0
    container_name: mariadb
    env_file:
      - .env
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:1.0
    container_name: wordpress
    depends_on:
      - mariadb
    env_file:
      - .env
    restart: always
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    image: nginx:1.0
    container_name: nginx
    depends_on:
      - wordpress
    restart: always
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    ports:
      - "443:443"
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/oelbied/data/mariadb
      o: bind
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/oelbied/data/wordpress
      o: bind

networks:
  inception:
    driver: bridge